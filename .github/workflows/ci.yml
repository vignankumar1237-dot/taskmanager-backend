name: Production CI - Build and Publish Backend Microservice

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ] # Validates pull requests before merging into production code

jobs:
  build-and-publish:
    name: Build, Tag & Publish Container
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # MNC Standard: Set up QEMU for robust multi-architecture compilation (AMD64 & ARM64)
      - name: Set up QEMU Multi-Platform Support
        uses: docker/setup-qemu-action@v3

      # MNC Standard: Initialize the advanced Buildx engine for advanced compilation tracking
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # MNC Standard: Generate production-grade dynamic container metadata and semantic tags
      - name: Extract Docker Metadata & Semantic Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compile Multi-Arch Image & Push to Production Registry
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }} # Only pushes on merge/push, avoids pushing broken PRs
          platforms: linux/amd64,linux/arm64 # MNC Architecture: Compiles natively for both standard Intel/AMD servers and modern ARM cloud clusters
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # MNC Standard: Distributed layer caching. Dramatically cuts down future build times by reusing unmodified Maven layers
          cache-from: type=gha
          cache-to: type=gha,mode=max
